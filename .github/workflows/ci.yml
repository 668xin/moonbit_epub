name: CI

# 固定与本地验证一致的 MoonBit 版本，避免 latest 的格式化规则漂移
# 导致 `moon fmt --check` 失败。升级工具链时需同步运行 `moon fmt`。
env:
  MOONBIT_INSTALL_VERSION: "0.10.14+32f9dd1de-nightly"

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show toolchain versions
        run: |
          moon version
          moonc -v 2>/dev/null || true

      - name: Update dependencies
        run: moon update

      - name: Check
        run: moon check --target wasm-gc

      - name: Build
        run: moon build --target wasm-gc

      - name: Test
        run: moon test --target wasm-gc

      - name: Format check
        run: moon fmt --check

  release-build:
    runs-on: ubuntu-latest
    needs: check-build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Build release artifact
        run: moon build --target wasm-gc --release

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: moon-epub-cli
          path: _build/wasm-gc/release/build/src/cli/
          if-no-files-found: warn
